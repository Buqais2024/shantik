name: Build PWA (one-time)
on:
  push:
    paths: ['.github/workflows/build-pwa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build index.html from Apps Script
        run: node build-pwa.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q build-pwa.js
          git add index.html
          git commit -m "Standalone PWA: calculator page moved from Apps Script"
          git push
